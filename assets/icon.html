<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #0B0C0C; }
  body { display: grid; place-items: center; }
  /* 12% safe padding per side — the mark fills the middle 76vmin (maskable-safe) */
  .mark { width: 76vmin; height: 76vmin; display: block; }
</style>
</head>
<body>
  <!-- unicodex icon: a single dashed mint rounded box (the reveal box) with a
       centred mint dot, on true-neutral near-black. Same motif as the app. -->
  <svg class="mark" viewBox="0 0 100 100" aria-hidden="true">
    <rect x="16" y="16" width="68" height="68" rx="18"
      fill="none" stroke="#56E8A4" stroke-width="6"
      stroke-dasharray="15 11" stroke-linecap="round"/>
    <circle cx="50" cy="50" r="9" fill="#56E8A4"/>
  </svg>
</body>
</html>
